tools:
  - class_name: "verl.tools.relational_all_tools.GetUserNameTool"
    config:
      type: native
    tool_schema:
      type: "function"
      function:
        name: "get_user_name"
        description: "Get the name of the user with the given user ID."
        parameters:
          type: "object"
          properties:
            user_id:
              title: "User Id"
              type: "integer"
          required: ["user_id"]

  - class_name: "verl.tools.relational_all_tools.ListUserIdsTool"
